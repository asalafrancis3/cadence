[workspace]
resolver = "2"
members = ["contracts/*", "keeper"]

[workspace.dependencies]
# Pinned to the major that matches the current Stellar protocol. Check
# https://crates.io/crates/soroban-sdk and Testnet's protocol version before bumping.
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
