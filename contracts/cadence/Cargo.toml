[package]
name = "cadence"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Non-custodial recurring payments (pull payments) for Soroban tokens"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
